<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Print Engine Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet">
<!-- Same reason as the storefront: theme has to be on <html> before the
     stylesheet paints, or every load flashes the wrong palette. -->
<script>
  (function(){
    var t; try{ t = localStorage.getItem('printly-theme'); }catch(e){}
    if(t !== 'light' && t !== 'dark') t = 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="/admin/css/admin.css?v={{V}}">
</head>
<body>

<!-- Sign-in gate. The panel markup below stays hidden until /api/admin/session
     says this is a staff account. -->
<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gateForm" onsubmit="return false">
    <div class="gate-logo">PRINT <b>ENGINE</b> <span>admin</span></div>
    <p class="muted" id="gateMsg">Sign in with your staff account.</p>
    <label class="field"><span>Email</span>
      <input id="gEmail" type="email" autocomplete="username"></label>
    <label class="field"><span>Password</span>
      <input id="gPass" type="password" autocomplete="current-password"></label>
    <button class="btn btn-primary btn-block" id="gBtn" onclick="gateSignIn()">Sign in</button>
    <p class="tiny muted" id="gateHint"></p>
  </form>
</div>

<!-- Forced password change: a staff account is created with a password the
     owner hands over, so it can't be left in place. -->
<div class="gate" id="pwGate" hidden>
  <form class="gate-card" onsubmit="return false">
    <div class="gate-logo">Set your password</div>
    <p class="muted">This account still uses the temporary password you were given.</p>
    <label class="field"><span>Current password</span>
      <input id="pwCur" type="password" autocomplete="current-password"></label>
    <label class="field"><span>New password</span>
      <input id="pwNew" type="password" autocomplete="new-password"></label>
    <button class="btn btn-primary btn-block" onclick="submitPassword()">Save and continue</button>
  </form>
</div>

<div class="shell" id="shell" hidden>
  <aside class="side" id="side">
    <div class="side-top">
      <div class="brand">PRINT <b>ENGINE</b><span>admin</span></div>
      <button class="icon-btn only-mobile" onclick="toggleSide()" aria-label="Close menu">
        <span class="material-symbols-outlined">close</span></button>
    </div>
    <nav class="menu" id="menu"></nav>
    <div class="side-foot">
      <a class="side-link" href="{{STOREFRONT}}" target="_blank" rel="noopener">
        <span class="material-symbols-outlined">storefront</span> View storefront</a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" onclick="toggleSide()" aria-label="Menu">
        <span class="material-symbols-outlined">menu</span></button>
      <div>
        <h1 class="page-title" id="pageTitle">Dashboard</h1>
        <p class="tiny muted" id="pageSub"></p>
      </div>
      <div class="topbar-right">
        <span class="live" id="liveDot" title="Live data">
          <i></i><span class="tiny muted" id="liveText">live</span></span>
        <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Switch theme">
          <span class="material-symbols-outlined">light_mode</span></button>
        <div class="who">
          <b id="whoName"></b>
          <span class="tiny muted" id="whoRole"></span>
        </div>
        <button class="btn btn-quiet btn-sm" onclick="signOut()">Sign out</button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
  <div class="side-scrim" id="sideScrim" onclick="toggleSide()"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Suggestions only — the field stays free text, because the courier a
     parcel actually went with is a fact, not a menu we get to constrain. -->
<datalist id="courierList">
  <option value="Delhivery"><option value="Blue Dart"><option value="DTDC">
  <option value="Ekart"><option value="XpressBees"><option value="Shadowfax">
  <option value="India Post"><option value="Amazon Shipping"><option value="Professional Couriers">
</datalist>

<script src="/admin/js/api.js?v={{V}}"></script>
<script src="/admin/js/theme.js?v={{V}}"></script>
<script src="/admin/js/dashboard.js?v={{V}}"></script>
<script src="/admin/js/settings.js?v={{V}}"></script>
<script src="/admin/js/inventory.js?v={{V}}"></script>
<script src="/admin/js/orders.js?v={{V}}"></script>
<script src="/admin/js/production.js?v={{V}}"></script>
<script src="/admin/js/dispatch.js?v={{V}}"></script>
<script src="/admin/js/customers.js?v={{V}}"></script>
<script src="/admin/js/support.js?v={{V}}"></script>
<script src="/admin/js/content.js?v={{V}}"></script>
<script src="/admin/js/reports.js?v={{V}}"></script>
<script src="/admin/js/app.js?v={{V}}"></script>
</body>
</html>
